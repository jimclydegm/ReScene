services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rescene
      POSTGRES_PASSWORD: rescene
      POSTGRES_DB: rescene
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - judge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rescene -d rescene"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  judge-postgres:
